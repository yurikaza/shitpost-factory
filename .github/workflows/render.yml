# Render a single concept video and optionally upload to YouTube
# Usage: called by concept-specific workflows

name: Render Video

on:
  workflow_call:
    inputs:
      concept:
        required: true
        type: string
        description: Concept ID to render
      brand:
        required: true
        type: string
        description: Brand name (folder under social-media-pipeline/)
      publish:
        required: false
        type: boolean
        default: true
        description: Upload rendered video to YouTube
      youtube_account:
        required: false
        type: string
        default: "gmail"
        description: "YouTube account: gmail or ortakca"

env:
  FACTORY_BRAND: ${{ inputs.brand }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install boto3

      - name: Install FFmpeg + yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-extra
          pip install yt-dlp

      - name: Create .env
        run: |
          echo "MIMO_API_KEY=${{ secrets.MIMO_API_KEY }}" > .env
          echo "MIMO_BASE_URL=${{ secrets.MIMO_BASE_URL }}" >> .env
          echo "MIMO_MODEL=${{ secrets.MIMO_MODEL }}" >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> .env
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> .env
          echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> .env
          echo "R2_BUCKET=${{ secrets.R2_BUCKET }}" >> .env
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> .env
          echo "IG_ACCESS_TOKEN=${{ secrets.IG_ACCESS_TOKEN }}" >> .env
          echo "IG_BUSINESS_ACCOUNT_ID=${{ secrets.IG_BUSINESS_ACCOUNT_ID }}" >> .env
          echo "DRY_RUN=false" >> .env

      - name: Render video
        run: |
          PYTHONPATH=src python -m factory.cli run \
            --concept ${{ inputs.concept }} \
            --brand ${{ inputs.brand }}

      - name: Find rendered video
        id: render
        run: |
          VIDEO=$(ls -t social-media-pipeline/${{ inputs.brand }}/output/${{ inputs.concept }}_*.mp4 output/${{ inputs.concept }}_*.mp4 2>/dev/null | head -1)
          if [ -n "$VIDEO" ]; then
            echo "video_path=$VIDEO" >> "$GITHUB_OUTPUT"
            echo "📹 Rendered: $VIDEO"
          else
            echo "⚠️ No video found"
            exit 1
          fi

      - name: Upload to YouTube
        if: inputs.publish && steps.render.outputs.video_path
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_GMAIL: ${{ secrets.YOUTUBE_REFRESH_TOKEN_GMAIL }}
          YOUTUBE_REFRESH_TOKEN_ORTAKCA: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ORTAKCA }}
        run: |
          VIDEO="${{ steps.render.outputs.video_path }}"
          CONCEPT="${{ inputs.concept }}"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          TITLE="${CONCEPT} — ${TIMESTAMP} #Shorts"
          DESCRIPTION="Auto-generated by shitpost-factory\nConcept: ${CONCEPT}\nBrand: ${{ inputs.brand }}\n\n#Shorts #shitpost #auto-generated #${CONCEPT}"

          # Select refresh token
          if [ "${{ inputs.youtube_account }}" = "ortakca" ]; then
            REFRESH_TOKEN="${{ secrets.YOUTUBE_REFRESH_TOKEN_ORTAKCA }}"
          else
            REFRESH_TOKEN="${{ secrets.YOUTUBE_REFRESH_TOKEN_GMAIL }}"
          fi

          echo "🔑 Getting access token..."
          ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$GOOGLE_CLIENT_ID" \
            -d "client_secret=$GOOGLE_CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          echo "📤 Uploading: $TITLE"

          FILE_SIZE=$(stat -c%s "$VIDEO")

          # Build metadata
          METADATA=$(python3 -c "
          import json
          meta = {
              'snippet': {
                  'title': '$TITLE',
                  'description': '$DESCRIPTION',
                  'tags': ['shitpost', 'auto-generated', '$CONCEPT'],
                  'categoryId': '22'
              },
              'status': {
                  'privacyStatus': 'public',
                  'selfDeclaredMadeForKids': False
              }
          }
          print(json.dumps(meta))
          ")

          # Initiate resumable upload
          UPLOAD_URL=$(curl -s -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Upload-Content-Type: video/mp4" \
            -H "X-Upload-Content-Length: $FILE_SIZE" \
            -d "$METADATA" \
            "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status" \
            -D - -o /dev/null | grep -i "location:" | awk '{print $2}' | tr -d '\r')

          if [ -z "$UPLOAD_URL" ]; then
            echo "❌ Failed to initiate upload"
            exit 1
          fi

          # Upload video
          RESPONSE=$(curl -s -X PUT \
            -H "Content-Type: video/mp4" \
            --data-binary "@$VIDEO" \
            "$UPLOAD_URL")

          VIDEO_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -n "$VIDEO_ID" ]; then
            echo "✅ https://youtube.com/watch?v=$VIDEO_ID"
          else
            echo "❌ Upload failed:"
            echo "$RESPONSE"
            exit 1
          fi

      - name: Publish to Instagram
        if: steps.render.outputs.video_path
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          VIDEO="${{ steps.render.outputs.video_path }}"
          PYTHONPATH=src python3 -c "
          import os, sys
          from pathlib import Path
          from datetime import datetime
          from factory.publish.instagram import InstagramPublisher
          from factory.publish.r2_upload import R2Uploader
          from factory.types import RenderedVideo, Script

          video = RenderedVideo(
              path=Path('$VIDEO'),
              duration_s=15.0,
              width=1080,
              height=1920,
              concept_id='${{ inputs.concept }}',
              created_at=datetime.utcnow(),
          )
          script = Script(
              hook='',
              body='',
              title='${{ inputs.concept }}',
              description='Auto-generated by shitpost-factory',
              hashtags=['shitpost', 'auto-generated'],
          )
          r2 = R2Uploader()
          ig = InstagramPublisher(r2_uploader=r2)
          result = ig.publish(video, script)
          if result.ok:
              print(f'✅ Instagram: published media_id={result.post_id}')
          else:
              print(f'❌ Instagram failed: {result.error}')
              sys.exit(1)
          "

      - name: Cleanup work directory
        if: always()
        run: |
          rm -rf work/ state.db
