name: produce

# every 8 hours. github cron is imprecise - expect 15-45 min drift.
# scheduled workflows auto-pause after 60 days with no push to the repo.
on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:
    inputs:
      concept:
        description: concept id (blank = all enabled)
        required: false
      publish:
        description: actually publish
        type: boolean
        default: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install ffmpeg + libass
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libass-dev

      - name: install deps
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      # TODO: restore state.db from an artifact or external store,
      # otherwise dedupe resets every run
      - name: run
        env:
          DRY_RUN: ${{ inputs.publish && 'false' || 'true' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          POSTIZ_API_URL: ${{ secrets.POSTIZ_API_URL }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: |
          if [ -n "${{ inputs.concept }}" ]; then
            python -m factory.cli run --concept "${{ inputs.concept }}"
          else
            python -m factory.cli run-all
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: |
            output/
            logs/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install ffmpeg + libass
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libass-dev

      - name: install deps
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: run tests
        run: python -m pytest tests/ -q

      - name: lint
        run: python -m ruff check src tests
