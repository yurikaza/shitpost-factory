# Upload a rendered video to YouTube
# Usage: called by concept workflows or manually

name: YouTube Upload

on:
  workflow_call:
    inputs:
      video_path:
        required: true
        type: string
        description: Path to the rendered video file
      title:
        required: true
        type: string
        description: Video title
      description:
        required: false
        type: string
        default: ""
        description: Video description
      tags:
        required: false
        type: string
        default: ""
        description: Comma-separated tags
      account:
        required: false
        type: string
        default: "gmail"
        description: "YouTube account to upload to: gmail or ortakca"
    secrets:
      GOOGLE_CLIENT_ID:
        required: true
      GOOGLE_CLIENT_SECRET:
        required: true
      YOUTUBE_REFRESH_TOKEN_GMAIL:
        required: true
      YOUTUBE_REFRESH_TOKEN_ORTAKCA:
        required: true

  workflow_dispatch:
    inputs:
      video_path:
        required: true
        type: string
        description: Path to the rendered video file
      title:
        required: true
        type: string
        description: Video title
      description:
        required: false
        type: string
        default: ""
      tags:
        required: false
        type: string
        default: ""
      account:
        required: false
        type: string
        default: "gmail"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get access token
        id: auth
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_GMAIL: ${{ secrets.YOUTUBE_REFRESH_TOKEN_GMAIL }}
          YOUTUBE_REFRESH_TOKEN_ORTAKCA: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ORTAKCA }}
        run: |
          if [ "${{ inputs.account }}" = "ortakca" ]; then
            REFRESH_TOKEN="$YOUTUBE_REFRESH_TOKEN_ORTAKCA"
          else
            REFRESH_TOKEN="$YOUTUBE_REFRESH_TOKEN_GMAIL"
          fi

          ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$GOOGLE_CLIENT_ID" \
            -d "client_secret=$GOOGLE_CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload to YouTube
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          VIDEO_FILE="${{ inputs.video_path }}"
          TITLE="${{ inputs.title }}"
          DESCRIPTION="${{ inputs.description }}"
          TAGS="${{ inputs.tags }}"

          echo "📤 Uploading: $TITLE"

          # Build metadata
          METADATA=$(python3 -c "
          import json
          meta = {
              'snippet': {
                  'title': $(python3 -c "import json; print(json.dumps('$TITLE'))"),
                  'description': $(python3 -c "import json; print(json.dumps('$DESCRIPTION'))"),
                  'tags': [t.strip() for t in '$TAGS'.split(',') if t.strip()],
                  'categoryId': '22'
              },
              'status': {
                  'privacyStatus': 'public',
                  'selfDeclaredMadeForKids': False
              }
          }
          print(json.dumps(meta))
          ")

          FILE_SIZE=$(stat -c%s "$VIDEO_FILE")

          # Initiate resumable upload
          UPLOAD_URL=$(curl -s -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Upload-Content-Type: video/mp4" \
            -H "X-Upload-Content-Length: $FILE_SIZE" \
            -d "$METADATA" \
            "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status" \
            -D - -o /dev/null | grep -i "location:" | awk '{print $2}' | tr -d '\r')

          if [ -z "$UPLOAD_URL" ]; then
            echo "❌ Failed to initiate upload"
            exit 1
          fi

          # Upload video file
          RESPONSE=$(curl -s -X PUT \
            -H "Content-Type: video/mp4" \
            --data-binary "@$VIDEO_FILE" \
            "$UPLOAD_URL")

          VIDEO_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -n "$VIDEO_ID" ]; then
            echo "✅ https://youtube.com/watch?v=$VIDEO_ID"
            echo "video_id=$VIDEO_ID" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Upload failed:"
            echo "$RESPONSE"
            exit 1
          fi
