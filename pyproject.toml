[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "shitpost-factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "typer>=0.12",
    "rich>=13.7",
    "ffmpeg-python>=0.2",
    "moviepy>=2.1",
    "faster-whisper>=1.0",
    "pillow>=10.3",
    "edge-tts>=6.1",
    "praw>=7.7",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
