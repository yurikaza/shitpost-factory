# concept: meme-bombs — viral clips + shitpost text
# Sources from multiple subreddits across categories
# No API key needed (pullpush.io + yt-dlp)

id: meme-bombs
enabled: true
description: >
  Viral Reddit clips with shitpost text overlay. Sources from fail videos,
  unexpected moments, satisfying clips, weird situations, karma, and more.
  The text makes it a shitpost — the clip is just the backdrop.
originality_risk: low
automatability: high

account:
  handle_youtube: ""
  handle_tiktok: ""
  handle_instagram: ""

sourcing:
  mode: reddit-video
  clips_per_video: 3
  min_upvotes: 10000
  max_duration_s: 15
  min_duration_s: 3
  subreddits:
    # Animals
    - AnimalsBeingDerps
    - AnimalsBeingBros
    # Fails & Wipeouts
    - Whatcouldgowrong
    - therewasanattempt
    - nonononoyes
    # Unexpected & Karma
    - Unexpected
    - instant_regret
    - JusticeServed
    # Weird & Cursed
    - mildlyinfuriating
    - CrappyDesign
    - confusing_perspective
    # Impressive
    - nextfuckinglevel
    - BeAmazed
    # Wholesome (with shitpost text = comedy)
    - MadeMeSmile
    - HumansBeingBros

script:
  target_words: 25
  hook_max_words: 6
  style: text_overlay
  tone: >
    Write like a shitpost account. Short, punchy, unhinged.
    The text should feel like a caption someone would slap on a funny video.
    Think: obvious observation stated like a threat, or cursed commentary.
    NEVER explain the joke. NEVER be wholesome. Sound like you've seen too much.
    Format: one hook line (top of screen), one punchline (bottom of screen).
    Max 8 words per line. If it's not funny in 2 seconds, it's too long.
  banned_words: [wait for it, omg, literally me, POV]

audio:
  narration: false
  music_mood: hype-loop
  music_gain_db: -12

video:
  max_duration_s: 15
  text_style: impact_bold
  text_position: top_and_bottom

caption:
  style: none

publish:
  hashtags_count: 5
  platforms: [tiktok, instagram, youtube]
