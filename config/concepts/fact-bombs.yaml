# concept #5 - cursed facts / unhinged "did you know"
# shitpost style: real facts framed in the most unsettling way possible

id: fact-bombs
enabled: true
description: Cursed knowledge. Real science facts delivered like threats. Unhinged energy, deadpan tone.
originality_risk: low-medium
automatability: high

account:
  handle_youtube: ""
  handle_tiktok: ""
  handle_instagram: ""

sourcing:
  mode: stock
  providers: [pexels]
  clips_per_video: 5
  query_strategy: from_script

script:
  facts_per_video: 5
  target_words: 110
  hook_max_words: 8
  tone: >
    Unhinged shitpost energy. Sound like you're threatening the viewer with
    knowledge. Deadpan, no enthusiasm, slightly menacing. The funnier and more
    cursed the better. Think "your bones are wet" energy. Never sound like a
    teacher or a documentary. Sound like someone who knows too much and is
    angry about it. Short punchy sentences. No "did you know?" — that's boring.
    Start with the most unhinged part of the fact.
  banned_words: [did you know, interesting, amazing, incredible, fun fact]

audio:
  narration: true
  music_mood: tense-loop
  music_gain_db: -20
  sfx: [boom, glitch]

video:
  max_duration_s: 45

caption:
  style: word_by_word

publish:
  hashtags_count: 5
  platforms: [tiktok, instagram, youtube]
