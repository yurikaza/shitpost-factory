<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0512512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0050;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F2EA;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#bg)"/>

  <!-- Factory silhouette -->
  <rect x="100" y="250" width="310" height="180" rx="16" fill="#1A1A1A" opacity="0.95"/>

  <!-- Chimneys -->
  <rect x="140" y="180" width="50" height="100" rx="8" fill="#1A1A1A" opacity="0.95"/>
  <rect x="320" y="200" width="50" height="80" rx="8" fill="#1A1A1A" opacity="0.95"/>

  <!-- Smoke -->
  <circle cx="165" cy="160" r="20" fill="white" opacity="0.7"/>
  <circle cx="180" cy="140" r="15" fill="white" opacity="0.5"/>
  <circle cx="345" cy="180" r="20" fill="white" opacity="0.7"/>
  <circle cx="360" cy="160" r="15" fill="white" opacity="0.5"/>

  <!-- Windows -->
  <rect x="130" y="280" width="45" height="45" rx="8" fill="#00F2EA"/>
  <rect x="195" y="280" width="45" height="45" rx="8" fill="#FF0050"/>
  <rect x="270" y="280" width="45" height="45" rx="8" fill="#00F2EA"/>
  <rect x="335" y="280" width="45" height="45" rx="8" fill="#FF0050"/>

  <!-- Door -->
  <rect x="210" y="350" width="90" height="80" rx="10" fill="#2A2A2A"/>

  <!-- Play button in door -->
  <circle cx="256" cy="390" r="18" fill="#00F2EA"/>
  <polygon points="248,378 248,402 272,390" fill="#1A1A1A"/>

  <!-- SPF text -->
  <text x="256" y="130" font-family="Impact, Arial Black, sans-serif" font-size="90" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="10">SPF</text>
</svg>
