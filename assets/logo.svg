<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0512512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0050;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F2EA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>

  <!-- Factory chimney -->
  <rect x="120" y="180" width="60" height="180" rx="8" fill="#1A1A1A" opacity="0.9"/>
  <rect x="330" y="200" width="60" height="160" rx="8" fill="#1A1A1A" opacity="0.9"/>

  <!-- Smoke puffs -->
  <circle cx="150" cy="160" r="25" fill="white" opacity="0.6"/>
  <circle cx="170" cy="140" r="20" fill="white" opacity="0.5"/>
  <circle cx="140" cy="130" r="15" fill="white" opacity="0.4"/>
  <circle cx="360" cy="180" r="25" fill="white" opacity="0.6"/>
  <circle cx="380" cy="160" r="20" fill="white" opacity="0.5"/>
  <circle cx="350" cy="150" r="15" fill="white" opacity="0.4"/>

  <!-- Factory body -->
  <rect x="100" y="280" width="310" height="140" rx="12" fill="#1A1A1A" opacity="0.9"/>

  <!-- Factory windows -->
  <rect x="130" y="300" width="40" height="40" rx="6" fill="#00F2EA" opacity="0.8"/>
  <rect x="190" y="300" width="40" height="40" rx="6" fill="#FF0050" opacity="0.8"/>
  <rect x="250" y="300" width="40" height="40" rx="6" fill="#00F2EA" opacity="0.8"/>
  <rect x="310" y="300" width="40" height="40" rx="6" fill="#FF0050" opacity="0.8"/>

  <!-- Factory door -->
  <rect x="200" y="350" width="110" height="70" rx="8" fill="#2A2A2A"/>
  <rect x="210" y="360" width="90" height="50" rx="4" fill="#333"/>

  <!-- Gear/Play button -->
  <circle cx="256" cy="385" r="15" fill="#00F2EA"/>
  <polygon points="250,375 250,395 270,385" fill="#1A1A1A"/>

  <!-- Text: SPF -->
  <text x="256" y="120" font-family="Impact, Arial Black, sans-serif" font-size="80" font-weight="bold" fill="url(#text)" text-anchor="middle" letter-spacing="8">SPF</text>

  <!-- Text: SHITPOST -->
  <text x="256" y="470" font-family="Impact, Arial Black, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="12">SHITPOST</text>

  <!-- Text: FACTORY -->
  <text x="256" y="500" font-family="Impact, Arial Black, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="8" opacity="0.8">FACTORY</text>
</svg>
